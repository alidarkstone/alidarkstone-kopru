name: Derle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - run: Copy-Item target/release/kopru.exe Kopru.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Kopru-Windows
          path: Kopru.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --release
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Köprü.app paketle (Intel + Apple Silicon)
        run: |
          APP="Köprü.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/kopru" \
            target/aarch64-apple-darwin/release/kopru target/x86_64-apple-darwin/release/kopru
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          if [ -f packaging/macos/AppIcon.icns ]; then cp packaging/macos/AppIcon.icns "$APP/Contents/Resources/"; fi
          # İmzasız; yalnızca yerel (ad-hoc) imza. İlk açılışta sağ tık > Aç gerekir.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Kopru-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kopru-macOS
          path: Kopru-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Kopru-Windows/Kopru.exe
            Kopru-macOS/Kopru-macOS.zip
