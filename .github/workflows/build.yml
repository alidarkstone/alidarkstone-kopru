name: Derle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Yalnızca okuma; sürüm yayımlayan iş kendi iznini alır.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: Copy-Item target/release/darkdrop.exe DarkDrop.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkDrop-Windows
          path: DarkDrop.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --release --locked
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: DarkDrop.app paketle (Intel + Apple Silicon)
        run: |
          APP="DarkDrop.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/darkdrop" \
            target/aarch64-apple-darwin/release/darkdrop target/x86_64-apple-darwin/release/darkdrop
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp assets/logo/AppIcon.icns "$APP/Contents/Resources/"
          # İmzasız; yalnızca yerel (ad-hoc) imza. İlk açılışta sağ tık > Aç gerekir.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" DarkDrop-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DarkDrop-macOS
          path: DarkDrop-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            DarkDrop-Windows/DarkDrop.exe
            DarkDrop-macOS/DarkDrop-macOS.zip
